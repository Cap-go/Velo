name: Setup Cloudflare Access

on:
  workflow_dispatch:
    inputs:
      app_host:
        description: Hostname (no scheme), e.g. capve.app
        required: false
        default: capve.app
        type: string
      allowed_emails:
        description: Comma-separated emails allowed through Access
        required: false
        default: ""
        type: string
      allowed_domains:
        description: Comma-separated email domains allowed through Access
        required: false
        default: ""
        type: string
  workflow_call:
    inputs:
      app_host:
        description: Hostname (no scheme)
        required: false
        default: capve.app
        type: string
      allowed_emails:
        description: Comma-separated emails allowed through Access
        required: false
        default: ""
        type: string
      allowed_domains:
        description: Comma-separated email domains allowed through Access
        required: false
        default: ""
        type: string

jobs:
  setup-access:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_ACCOUNT_ID: 9ee3d7479a3c359681e3fab2c8cb22c0
      APP_HOST: ${{ inputs.app_host || 'capve.app' }}
      ACCESS_ALLOWED_EMAILS: ${{ inputs.allowed_emails }}
      ACCESS_ALLOWED_DOMAINS: ${{ inputs.allowed_domains }}
      APPLY_VARS: "1"
      WORKER_NAME: velo
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Configure path-based Cloudflare Access
        run: bun run setup-access
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
