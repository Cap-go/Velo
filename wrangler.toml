name = "velo"
main = "worker/index.ts"
compatibility_date = "2025-08-26"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./dist"
not_found_handling = "single-page-application"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "velo-db"
database_id = "eb916c67-6e45-4798-a6d9-c0e47f99cb8d"
migrations_dir = "migrations"

[vars]
APP_URL = "http://localhost:5173"
# AUTH_SECRET = "set-a-long-random-secret-in-production"
# RESEND_API_KEY = "re_..."
# EMAIL_FROM = "Capve <noreply@capve.app>"

[env.production]
# Keep worker name "velo" (wrangler defaults to velo-production otherwise).
name = "velo"
vars = { APP_URL = "https://capve.app" }
# AUTH_SECRET — set via `wrangler secret put AUTH_SECRET` in production
# RESEND_API_KEY — optional; emails log to console when unset

# Custom domains for production. With @cloudflare/vite-plugin, routes under
# [env.production] are copied into dist/velo/wrangler.json only when the build
# sets CLOUDFLARE_ENV=production (see deploy workflow / package.json "deploy").
# Requires capve.app zone in the Cloudflare account for DNS to be provisioned.

[[env.production.routes]]
pattern = "capve.app"
custom_domain = true

[[env.production.routes]]
pattern = "www.capve.app"
custom_domain = true

[[env.production.d1_databases]]
binding = "DB"
database_name = "velo-db"
database_id = "eb916c67-6e45-4798-a6d9-c0e47f99cb8d"
migrations_dir = "migrations"
