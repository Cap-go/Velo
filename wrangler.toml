name = "velo"
main = "worker/index.ts"
compatibility_date = "2025-08-26"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./dist"
not_found_handling = "single-page-application"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "velo-db"
database_id = "eb916c67-6e45-4798-a6d9-c0e47f99cb8d"
migrations_dir = "migrations"

[vars]
APP_URL = "http://localhost:5173"
# TEAM_DOMAIN = "https://yourteam.cloudflareaccess.com"
# POLICY_AUD = "your-access-application-audience-tag"

[env.production]
# Keep worker name "velo" (wrangler defaults to velo-production otherwise).
name = "velo"
vars = { APP_URL = "https://capve.app" }
# Set after configuring Zero Trust Access (path-based on /app and /api/programs*):
# TEAM_DOMAIN = "https://yourteam.cloudflareaccess.com"
# POLICY_AUD = "your-access-application-audience-tag"

# Custom domains for production. With @cloudflare/vite-plugin, routes under
# [env.production] are copied into dist/velo/wrangler.json only when the build
# sets CLOUDFLARE_ENV=production (see deploy workflow / package.json "deploy").
# Requires capve.app zone in the Cloudflare account for DNS to be provisioned.

[[env.production.routes]]
pattern = "capve.app"
custom_domain = true

[[env.production.routes]]
pattern = "www.capve.app"
custom_domain = true

[[env.production.d1_databases]]
binding = "DB"
database_name = "velo-db"
database_id = "eb916c67-6e45-4798-a6d9-c0e47f99cb8d"
migrations_dir = "migrations"
